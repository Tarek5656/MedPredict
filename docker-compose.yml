version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medpredict_db
      POSTGRES_USER: medpredict_user
      POSTGRES_PASSWORD: medpredict_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/venv
      - ./ai-service/training/data:/data:ro
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: medpredict_db
      POSTGRES_USER: medpredict_user
      POSTGRES_PASSWORD: medpredict_password
      AI_SERVICE_URL: http://ai-service:5000
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      TWILIO_ACCOUNT_SID: AC6b71a815241260288c7dba7f65759d74
      TWILIO_AUTH_TOKEN: 8b5db5aeae238f63334786d5c379cb7a
      TWILIO_FROM_NUMBER: +17622132680

  ai-service:
    build: ./ai-service
    volumes:
      - ./ai-service:/app
    ports:
      - "5000:5000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health').read(); print('ok')\""
        ]
      interval: 10s
      timeout: 5s
      retries: 20
  
  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      backend:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  celery_worker:
    build: ./backend
    command: celery -A config worker -l INFO
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      TWILIO_ACCOUNT_SID: AC6b71a815241260288c7dba7f65759d74
      TWILIO_AUTH_TOKEN: 8b5db5aeae238f63334786d5c379cb7a
      TWILIO_FROM_NUMBER: +17622132680
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: medpredict_db
      POSTGRES_USER: medpredict_user
      POSTGRES_PASSWORD: medpredict_password
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_beat:
    build: ./backend
    command: celery -A config beat -l INFO
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: medpredict_db
      POSTGRES_USER: medpredict_user
      POSTGRES_PASSWORD: medpredict_password
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata: