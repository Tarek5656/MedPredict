version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medpredict_db
      POSTGRES_USER: medpredict_user
      POSTGRES_PASSWORD: medpredict_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/venv
      - ./ai-service/training/data:/data:ro
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: medpredict_db
      POSTGRES_USER: medpredict_user
      POSTGRES_PASSWORD: medpredict_password
      AI_SERVICE_URL: http://ai-service:5000

  ai-service:
    build: ./ai-service
    volumes:
      - ./ai-service:/app
    ports:
      - "5000:5000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health').read(); print('ok')\""
        ]
      interval: 10s
      timeout: 5s
      retries: 20
  
  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata: