version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/venv
    env_file:
      - .env  # <- adaptez le chemin si besoin : ici la racine

  ai-service:
    build: ./ai-service
    volumes:
      - ./ai-service:/app
    ports:
      - "5000:5000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health').read(); print('ok')\""
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    env_file:
      - .env
    depends_on:
      - ollama
    environment:
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_MODEL: "mistral:latest"
      OLLAMA_TIMEOUT: "60"
      OLLAMA_KEEP_ALIVE: "30m"
      TZ_NAME: "Africa/Casablanca"

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      backend:
        condition: service_started
    env_file:
      - .env

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  celery_worker:
    build: ./backend
    command: celery -A config worker -l INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env

  celery_beat:
    build: ./backend
    command: celery -A config beat -l INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env

  ngrok:
    image: ngrok/ngrok:latest
    command: http backend:8000
    ports:
      - "4040:4040"
    env_file:
      - .env

volumes:
  pgdata:
  ollama:
